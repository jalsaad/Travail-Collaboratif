# ---------------------------------------------------------------------------
# ops/goaccess/nginx-statistiques.conf
# Expose le rapport GoAccess sur /statistiques, derrière un mot de passe.
#
# À inclure DANS le bloc server HTTPS de travail-collaboratif.be :
#
#     include /etc/nginx/snippets/statistiques.conf;
#
# Le rapport n'est jamais déposé dans un dossier public : il vit sous
# /var/lib/goaccess et n'est servi que par cet emplacement authentifié. La
# recette d'OVH le place dans /var/www/html, où il serait lisible par
# quiconque en connaît l'adresse — avec les référents et les pages visitées.
# ---------------------------------------------------------------------------

# La barre oblique finale est renvoyée vers la forme sans barre : c'est
# l'inverse de l'usage pour un dossier, et c'est ici la seule forme correcte —
# voir ci-dessous.
location = /statistiques/ {
    return 301 /statistiques;
}

# Correspondance EXACTE et SANS barre finale, vers le fichier lui-même.
#
# Avec une barre finale, Nginx tient la requête pour un dossier et concatène le
# nom du fichier d'index à l'alias : il cherchait « rapport.htmlindex.html » et
# répondait 500. Sans elle, l'alias désigne bien un fichier et il le sert.
#
# Servir ce seul fichier plutôt que le dossier rend au passage le fichier de
# travail « rapport.en-cours.html » inatteignable.
location = /statistiques {
    # Libellé en ASCII pur : la RFC 7617 n'admet pas d'autre jeu de caractères
    # dans un « realm », et certains navigateurs, plutôt que d'afficher la
    # fenêtre de saisie, se contentent alors d'un message d'erreur.
    auth_basic "Statistiques Travail Collaboratif";
    auth_basic_user_file /etc/nginx/.htpasswd-statistiques;

    alias /var/lib/goaccess/rapport.html;
    default_type text/html;

    # Rien à indexer ni à conserver en cache ici.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;

    # Pas de Content-Security-Policy ici, et c'est délibéré. Une politique
    # stricte y avait été posée par précaution ; elle interdisait les appels
    # `fetch()` que le rapport émet à son initialisation, laissant à l'écran un
    # indicateur d'attente et le message « No authentication provided ».
    #
    # Le rapport est un fichier statique produit par nous, servi derrière un
    # mot de passe, et sans contenu venu d'un tiers : il n'y a pas de script
    # étranger à contenir. Une politique qui casse la page sans réduire de
    # risque réel ne vaut pas d'être gardée.
}
