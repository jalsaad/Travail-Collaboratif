# ---------------------------------------------------------------------------
# ops/goaccess/nginx-statistiques.conf
# Expose le rapport GoAccess sur /statistiques, derrière un mot de passe.
#
# À inclure DANS le bloc server HTTPS de travail-collaboratif.be :
#
#     include /etc/nginx/snippets/statistiques.conf;
#
# Le rapport n'est jamais déposé dans un dossier public : il vit sous
# /var/lib/goaccess et n'est servi que par cet emplacement authentifié. La
# recette d'OVH le place dans /var/www/html, où il serait lisible par
# quiconque en connaît l'adresse — avec les référents et les pages visitées.
# ---------------------------------------------------------------------------

location = /statistiques {
    return 301 /statistiques/;
}

# Correspondance EXACTE vers le fichier, et non un dossier : `alias` combiné à
# `try_files` ou à `index` est un piège connu de Nginx — le chemin résolu n'est
# pas celui qu'on attend et la requête finit en 404. Ici l'emplacement ne sert
# qu'un seul fichier, ce qui règle le problème et, au passage, rend le fichier
# de travail « rapport.en-cours.html » inatteignable.
location = /statistiques/ {
    auth_basic "Statistiques de fréquentation";
    auth_basic_user_file /etc/nginx/.htpasswd-statistiques;

    alias /var/lib/goaccess/rapport.html;
    default_type text/html;

    # Rien à indexer ni à conserver en cache ici.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;

    # Le rapport est autonome : son CSS et son JavaScript sont en ligne, il ne
    # charge aucune ressource externe.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src data:" always;
}
